; =============================================================================
; inventory/hosts.ini
; Two OS-specific groups, combined into one target group. This is what gives
; you the choice: run on CentOS only, Ubuntu only, or both together.
; =============================================================================

[redhat]
redhat ansible_host=3.227.242.21 ansible_user=ec2-user ansible_ssh_private_key_file=/home/kiran/.ssh/keypair-02.pem

[ubuntu]
ubuntu ansible_host=98.80.72.92 ansible_user=ubuntu ansible_ssh_private_key_file=/home/kiran/.ssh/keypair-02.pem

; The playbook targets this combined group by default.
[postgresql_servers:children]
redhat
ubuntu

; -----------------------------------------------------------------------
; Usage:
;   Run on CentOS only : ansible-playbook -i inventory/hosts.ini playbook.yml --limit centos
;   Run on Ubuntu only  : ansible-playbook -i inventory/hosts.ini playbook.yml --limit ubuntu
;   Run on both         : ansible-playbook -i inventory/hosts.ini playbook.yml
;                          (or explicitly: --limit centos:ubuntu)
; -----------------------------------------------------------------------
