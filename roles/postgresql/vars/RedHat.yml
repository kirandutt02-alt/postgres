---
# =============================================================================
# OS-specific values for RedHat family (CentOS / RHEL / Rocky / Alma)
# Keeps the role OS-independent: tasks/main.yml just includes the file that
# matches ansible_os_family, so the same task logic works everywhere.
# =============================================================================
postgresql_packages:
  - "postgresql{{ postgresql_version }}-server"
  - "postgresql{{ postgresql_version }}"
  - "postgresql{{ postgresql_version }}-contrib"

postgresql_service_name: "postgresql-{{ postgresql_version }}"
postgresql_data_dir: "/var/lib/pgsql/{{ postgresql_version }}/data"
postgresql_config_dir: "/var/lib/pgsql/{{ postgresql_version }}/data"
postgresql_bin_dir: "/usr/pgsql-{{ postgresql_version }}/bin"

postgresql_pgdg_repo_rpm: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm"

postgresql_system_user: postgres
postgresql_system_group: postgres
