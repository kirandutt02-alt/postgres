---
# =============================================================================
# roles/postgresql/tasks/main.yml
# Entry point. Detects the OS family and dispatches to the matching task
# file, so the exact same role runs unmodified on CentOS, Ubuntu, or both
# at once in the same play (see inventory/hosts.ini + playbook.yml).
# =============================================================================

- name: Fail fast on unsupported operating systems
  ansible.builtin.fail:
    msg: >
      This role supports only RedHat-family (CentOS/RHEL/Rocky/Alma) and
      Debian-family (Ubuntu/Debian) hosts. Detected: {{ ansible_distribution }}
      {{ ansible_distribution_version }} (family: {{ ansible_os_family }}).
  when: ansible_os_family not in ['RedHat', 'Debian']

- name: Load OS-family specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install PostgreSQL {{ postgresql_version }} on RedHat family
  ansible.builtin.include_tasks: install-RedHat.yml
  when: ansible_os_family == "RedHat"

- name: Install PostgreSQL {{ postgresql_version }} on Debian family
  ansible.builtin.include_tasks: install-Debian.yml
  when: ansible_os_family == "Debian"

- name: Deploy PostgreSQL configuration from templates
  ansible.builtin.include_tasks: configure.yml

- name: Provision databases and roles
  ansible.builtin.include_tasks: database.yml
  when: (postgresql_databases | length > 0) or (postgresql_users | length > 0)
