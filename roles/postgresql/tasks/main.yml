    - name: Install PostgreSQL packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
          - acl
        state: present
        update_cache: true

    - name: Ensure PostgreSQL is started and enabled
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Detect installed PostgreSQL version
      ansible.builtin.command: ls /etc/postgresql
      register: pg_installed_versions
      changed_when: false

    - name: Set postgresql_conf_dir to the actual installed version
      ansible.builtin.set_fact:
        postgresql_conf_dir: "/etc/postgresql/{{ pg_installed_versions.stdout_lines[0] }}/main"

    - name: Deploy postgresql.conf
      ansible.builtin.template:
        src: postgresql.conf.j2
        dest: "{{ postgresql_conf_dir }}/postgresql.conf"
      notify: restart postgresql

    - name: Deploy pg_hba.conf
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
      notify: restart postgresql
    