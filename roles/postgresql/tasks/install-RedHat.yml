---
# =============================================================================
# roles/postgresql/tasks/install-RedHat.yml
# Version-specific install path for CentOS / RHEL / Rocky / Alma.
# =============================================================================

- name: Check if PGDG repo file actually exists on disk
  ansible.builtin.stat:
    path: /etc/yum.repos.d/pgdg-redhat-all.repo
  register: pgdg_repo_file

- name: Deregister stale pgdg-redhat-repo package record if the repo file is missing
  ansible.builtin.dnf:
    name: pgdg-redhat-repo
    state: absent
  when: not pgdg_repo_file.stat.exists

- name: Install PGDG repository RPM
  ansible.builtin.dnf:
    name: "{{ postgresql_pgdg_repo_rpm }}"
    state: present
    disable_gpg_check: true
  when: postgresql_use_pgdg_repo

- name: Disable the distro's built-in postgresql module stream (EL8+)
  ansible.builtin.command: dnf -qy module disable postgresql
  register: _pg_module_disable
  changed_when: "'Nothing to do' not in _pg_module_disable.stdout"
  failed_when: false
  when:
    - postgresql_use_pgdg_repo
    - ansible_distribution_major_version | int >= 8

- name: Install PostgreSQL {{ postgresql_version }} packages
  ansible.builtin.dnf:
    name: "{{ postgresql_packages }}"
    state: present

- name: Install psycopg2 (required by Ansible community.postgresql modules)
  ansible.builtin.dnf:
    name: python3-psycopg2
    state: present

- name: Check whether the data directory is already initialized
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: pg_data_check

- name: Initialize the PostgreSQL {{ postgresql_version }} database cluster
  ansible.builtin.command: "{{ postgresql_bin_dir }}/postgresql-{{ postgresql_version }}-setup initdb"
  become: true
  when: not pg_data_check.stat.exists

- name: Ensure PostgreSQL service is enabled and started
  ansible.builtin.service:
    name: "{{ postgresql_service_name }}"
    enabled: "{{ postgresql_service_enabled }}"
    state: "{{ postgresql_service_state }}"
