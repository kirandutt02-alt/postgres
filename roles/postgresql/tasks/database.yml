---
# =============================================================================
# roles/postgresql/tasks/database.yml
# Optional: create databases and roles from postgresql_databases /
# postgresql_users (defaults/main.yml). Only runs when those lists are set.
# Requires the community.postgresql collection (see requirements.yml).
# =============================================================================

- name: Create PostgreSQL databases
  become: true
  become_user: "{{ postgresql_system_user }}"
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    encoding: "{{ item.encoding | default('UTF8') }}"
    lc_collate: "{{ item.lc_collate | default(postgresql_default_locale) }}"
    lc_ctype: "{{ item.lc_ctype | default(postgresql_default_locale) }}"
    # template0 has no locale-specific data, so it accepts any collation —
    # avoids "new collation is incompatible with the collation of the
    # template database" when the cluster's default locale (often C.UTF-8
    # on fresh Ubuntu/Debian installs) differs from what's requested here.
    template: template0
    state: present
  loop: "{{ postgresql_databases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create PostgreSQL users/roles
  become: true
  become_user: "{{ postgresql_system_user }}"
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: "{{ item.role_attr_flags | default(omit) }}"
    state: present
  loop: "{{ postgresql_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true