---
# =============================================================================
# roles/postgresql/defaults/main.yml
# Lowest-priority variables. Override in group_vars/host_vars/playbook vars.
# =============================================================================

# ---------------------------------------------------------------------------
# Version control — this is what makes the install version-specific
# ---------------------------------------------------------------------------
postgresql_version: "16"          # e.g. "13", "14", "15", "16", "17"

# Use the official PostgreSQL PGDG repo (recommended — gives access to every
# version on every OS instead of whatever ships in the distro).
postgresql_use_pgdg_repo: true

# ---------------------------------------------------------------------------
# Service control
# ---------------------------------------------------------------------------
postgresql_service_enabled: true
postgresql_service_state: started

# ---------------------------------------------------------------------------
# Connection / network settings (used in postgresql.conf.j2)
# ---------------------------------------------------------------------------
postgresql_listen_addresses: "*"
postgresql_port: 5432
postgresql_max_connections: 100

# ---------------------------------------------------------------------------
# Memory tuning (used in postgresql.conf.j2)
# ---------------------------------------------------------------------------
postgresql_shared_buffers: "128MB"
postgresql_effective_cache_size: "4GB"
postgresql_work_mem: "4MB"
postgresql_maintenance_work_mem: "64MB"
postgresql_wal_buffers: "-1"       # "-1" = let Postgres auto-tune

# ---------------------------------------------------------------------------
# Logging (used in postgresql.conf.j2)
# ---------------------------------------------------------------------------
postgresql_logging_collector: true
postgresql_log_directory: "log"
postgresql_log_filename: "postgresql-%a.log"
postgresql_log_min_duration_statement: -1   # -1 disables

# ---------------------------------------------------------------------------
# SSL
# ---------------------------------------------------------------------------
postgresql_ssl: false

# ---------------------------------------------------------------------------
# Free-form extra settings appended verbatim to postgresql.conf
# Example:
# postgresql_extra_conf_settings:
#   random_page_cost: "1.1"
#   checkpoint_completion_target: "0.9"
# ---------------------------------------------------------------------------
postgresql_extra_conf_settings: {}

# ---------------------------------------------------------------------------
# pg_hba.conf rules (used in pg_hba.conf.j2) — fully variablized, add/remove
# entries freely from group_vars without touching the template.
# ---------------------------------------------------------------------------
postgresql_hba_entries:
  - type: local
    database: all
    user: postgres
    auth_method: peer
  - type: local
    database: all
    user: all
    auth_method: peer
  - type: host
    database: all
    user: all
    address: 127.0.0.1/32
    auth_method: md5
  - type: host
    database: all
    user: all
    address: "::1/128"
    auth_method: md5

# ---------------------------------------------------------------------------
# Databases / roles to create post-install (optional)
# ---------------------------------------------------------------------------
postgresql_default_locale: "C.UTF-8"

postgresql_databases: []
# postgresql_databases:
#   - name: appdb
#     encoding: UTF8
#     lc_collate: en_US.UTF-8
#     lc_ctype: en_US.UTF-8

postgresql_users: []
# postgresql_users:
#   - name: appuser
#     password: "changeme"
#     role_attr_flags: "CREATEDB,NOSUPERUSER"
