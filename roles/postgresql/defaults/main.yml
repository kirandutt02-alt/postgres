postgresql_conf_dir: "/etc/postgresql/16/main"   # adjust to match the installed PG version

postgresql_listen_addresses: "localhost"
postgresql_port: 5432

# pg_hba.conf lines, in order, exactly as they should appear in the file
postgresql_hba_entries:
  - "local   all             postgres                                peer"
  - "local   all             all                                     peer"
  - "host    all             all             127.0.0.1/32            scram-sha-256"
  - "host    all             all             ::1/128                 scram-sha-256"

# App database + user this playbook creates
postgresql_db_name: "appdb"
postgresql_db_user: "appuser"
postgresql_db_password: "changeme"   # override per environment, ideally via ansible-vault
